name: Native plugins
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure Windows x64
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DIPLUG_DEPLOY_PLUGINS=OFF
      - name: Configure macOS Universal
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DIPLUG_DEPLOY_PLUGINS=OFF
      - name: Build VST3 and core tests
        run: cmake --build build --config Release --target Scoria-vst3 scoria_tests scoria_dsp_tests scoria_completion_tests --parallel 3
      - name: Build AU and native host tests
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target scoria_au_tests --parallel 3
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate AU
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R build/out/Scoria.component "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar || true
          for attempt in 1 2 3 4 5; do
            if auval -v aufx Scor TlDs; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Package complete bundles and notices
        shell: bash
        run: |
          cp README.md LICENSE.md AGENTS.md build/out/
          mkdir -p build/out/docs
          cp docs/*.md build/out/docs/
          cd build/out
          cmake -E tar cfv "../../Scoria-0.0.3-${{ runner.os }}.zip" --format=zip .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Scoria-0.0.3-${{ runner.os }}
          path: Scoria-0.0.3-*.zip
          if-no-files-found: error
